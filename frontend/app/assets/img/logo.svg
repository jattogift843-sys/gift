<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MT5 Smart Market">
  <defs>
    <radialGradient id="mt5chrome" cx="37%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#eef1f4"/>
      <stop offset="62%" stop-color="#c3c9d0"/>
      <stop offset="86%" stop-color="#9aa1aa"/>
      <stop offset="100%" stop-color="#6f767f"/>
    </radialGradient>
    <linearGradient id="mt5rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c9ced5"/>
      <stop offset="100%" stop-color="#82888f"/>
    </linearGradient>
    <radialGradient id="mt5spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- metallic sphere -->
  <circle cx="50" cy="50" r="49" fill="url(#mt5rim)"/>
  <circle cx="50" cy="50" r="45.5" fill="url(#mt5chrome)"/>
  <ellipse cx="39" cy="28" rx="22" ry="13" fill="url(#mt5spec)"/>
  <path d="M14 66a45 45 0 0 0 72 0 45 45 0 0 1-72 0z" fill="#5f666e" opacity="0.35"/>

  <!-- 3-fold rotational mark -->
  <g stroke="#0c0e12" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M59.3 21.5 A30 30 0 0 1 79.3 56.2"/>
    <path d="M59.3 21.5 A30 30 0 0 1 79.3 56.2" transform="rotate(120 50 50)"/>
    <path d="M59.3 21.5 A30 30 0 0 1 79.3 56.2" transform="rotate(240 50 50)"/>
  </g>
  <g fill="#0c0e12">
    <circle cx="50" cy="20" r="9"/>
    <circle cx="24" cy="65" r="9"/>
    <circle cx="76" cy="65" r="9"/>
  </g>

  <!-- centre hub with 5 -->
  <circle cx="50" cy="50" r="13" fill="#0c0e12"/>
  <circle cx="50" cy="50" r="13" fill="none" stroke="#e9edf2" stroke-width="1.4"/>
  <text x="50" y="50.5" text-anchor="middle" dominant-baseline="central"
        font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="800" font-size="17" fill="#ffffff">5</text>
</svg>
